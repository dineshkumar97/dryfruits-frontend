
@if (!isLoginPage) {

<div class="admin-layout">

    <!-- MOBILE BACKDROP -->
    @if (isSidebarOpen) {
    <button
        type="button"
        class="sidebar-backdrop"
        aria-label="Close sidebar"
        (click)="closeSidebar()">
    </button>
    }

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" [class.open]="isSidebarOpen">

        <!-- BRAND -->
        <div class="sidebar-brand">
            <a routerLink="/nutnest-admin" (click)="closeSidebar()">
                <span class="brand-name">RATASREE.</span>
                <span class="brand-label">ADMINISTRATION</span>
            </a>
        </div>

        <!-- NAVIGATION -->
        <nav class="sidebar-nav">

            <span class="nav-heading">MAIN MENU</span>

            <!-- DASHBOARD -->
            <a
                routerLink="/nutnest-admin"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                class="nav-link"
                (click)="closeSidebar()">

                <span class="nav-icon">▦</span>
                <span>Dashboard</span>
            </a>

            <span class="nav-heading management-heading">
                MANAGEMENT
            </span>

            <!-- PRODUCTS -->
            <a
                routerLink="/nutnest-admin/products"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()">

                <span class="nav-icon">▣</span>
                <span>Products</span>
            </a>

            <!-- CATEGORIES -->
            <a
                routerLink="/nutnest-admin/categories"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()">

                <span class="nav-icon">▤</span>
                <span>Categories</span>
            </a>

            <!-- ORDERS -->
            <a
                routerLink="/nutnest-admin/orders"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()">

                <span class="nav-icon">▧</span>
                <span>Orders</span>
            </a>

            <!-- CUSTOMERS -->
            <a
                routerLink="/nutnest-admin/customers"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()">

                <span class="nav-icon">♙</span>
                <span>Customers</span>
            </a>

            <!-- INVENTORY -->
            <a
                routerLink="/nutnest-admin/inventory"
                routerLinkActive="active"
                class="nav-link"
                (click)="closeSidebar()">

                <span class="nav-icon">◷</span>
                <span>Inventory</span>
            </a>

            <!-- VISIT CUSTOMER STORE -->
            <!-- <a
                routerLink="/home"
                class="nav-link"
                (click)="closeSidebar()">

                <span class="nav-icon">⌂</span>
                <span>Visit Store</span>
            </a> -->

        </nav>

        <!-- SIDEBAR FOOTER -->
        <div class="sidebar-footer">
            <span>RATASREE.</span>
            <p>Premium Dry Fruits Store</p>
        </div>

    </aside>

    <!-- MAIN -->
    <div class="admin-main">

        <!-- HEADER -->
        <header
  class="admin-header"
  [class.header-hidden]="isSidebarOpen"
  [class.scrolled]="isScrolled">

            <button
                type="button"
                class="menu-toggle"
                aria-label="Toggle sidebar"
                (click)="toggleSidebar()">

                ☰
            </button>

            <div class="header-title">
                <span>WELCOME TO</span>
                <h1>Admin Panel</h1>
            </div>

            <!-- ADMIN PROFILE -->
            <div class="admin-profile-wrapper">

                <button
                    type="button"
                    class="admin-profile"
                    (click)="toggleProfileMenu()"
                    [attr.aria-expanded]="isProfileMenuOpen"
                    aria-label="Administrator account menu">

                    <div class="profile-avatar">
                        {{ adminInitial }}
                    </div>

                    <div class="profile-info">
                        <strong>{{ adminName }}</strong>
                        <span>{{ adminEmail }}</span>
                    </div>

                    <span
                        class="profile-chevron"
                        [class.open]="isProfileMenuOpen">
                        ▾
                    </span>

                </button>

                <!-- DROPDOWN -->
                @if (isProfileMenuOpen) {

                <div class="profile-dropdown">

                    <div class="dropdown-heading">
                        <strong>{{ adminName }}</strong>
                        <span>{{ adminEmail }}</span>
                    </div>

                    <button
                        type="button"
                        class="dropdown-item"
                        (click)="openProfile()">

                        <span>♙</span>
                        <span>My Profile</span>
                    </button>

                    <div class="dropdown-divider"></div>

                    <button
                        type="button"
                        class="dropdown-item logout-item"
                        (click)="logout()">

                        <span>⇥</span>
                        <span>Logout</span>
                    </button>

                </div>

                }

            </div>

        </header>

        <!-- PAGE CONTENT -->
        <main class="admin-content">
            <router-outlet></router-outlet>
        </main>

    </div>

</div>

} @else {

<!-- LOGIN PAGE -->
<router-outlet></router-outlet>

}
