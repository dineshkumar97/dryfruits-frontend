<div class="admin-layout">

    <!-- Mobile Sidebar Backdrop -->
    @if (isSidebarOpen) {
    <button type="button" class="sidebar-backdrop" aria-label="Close sidebar" (click)="closeSidebar()">
    </button>
    }

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" [class.open]="isSidebarOpen">

        <!-- Brand -->
        <div class="sidebar-brand">
            <a routerLink="/admin" (click)="closeSidebar()">
                <span class="brand-name">NutNest</span>
                <span class="brand-label">ADMINISTRATION</span>
            </a>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">

            <span class="nav-heading">MAIN MENU</span>

            <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
                class="nav-link" (click)="closeSidebar()">

                <span class="nav-icon">▦</span>
                <span>Dashboard</span>

            </a>

            <span class="nav-heading management-heading">
                MANAGEMENT
            </span>

            <a routerLink="/admin/products" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">

                <span class="nav-icon">▣</span>
                <span>Products</span>

            </a>

            <a routerLink="/admin/categories" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">

                <span class="nav-icon">▤</span>
                <span>Categories</span>

            </a>

            <a routerLink="/admin/orders" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">

                <span class="nav-icon">▧</span>
                <span>Orders</span>

            </a>

            <a routerLink="/admin/customers" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">

                <span class="nav-icon">♙</span>
                <span>Customers</span>

            </a>

            <a routerLink="/admin/inventory" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">

                <span class="nav-icon">◷</span>
                <span>Inventory</span>

            </a>

        </nav>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
            <span>NutNest</span>
            <p>Premium Dry Fruits Store</p>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <div class="admin-main">

        <!-- TOP HEADER -->
        <header class="admin-header">

            <button type="button" class="menu-toggle" aria-label="Toggle sidebar" (click)="toggleSidebar()">
                ☰
            </button>

            <div class="header-title">
                <span>WELCOME TO</span>
                <h1>Admin Panel</h1>
            </div>


            <!-- ADMIN PROFILE DROPDOWN -->
            <div class="admin-profile-wrapper">

                <button type="button" class="admin-profile" (click)="toggleProfileMenu()"
                    [attr.aria-expanded]="isProfileMenuOpen" aria-label="Administrator account menu">

                    <div class="profile-avatar">A</div>

                    <div class="profile-info">
                        <strong>Administrator</strong>
                        <span>NutNest Store</span>
                    </div>

                    <span class="profile-chevron" [class.open]="isProfileMenuOpen">
                        ▾
                    </span>

                </button>

                <!-- DROPDOWN MENU -->
                @if (isProfileMenuOpen) {

                <div class="profile-dropdown">

                    <div class="dropdown-heading">
                        <strong>Administrator</strong>
                        <span>Manage your account</span>
                    </div>

                    <button type="button" class="dropdown-item" (click)="openProfile()">

                        <span>♙</span>
                        <span>My Profile</span>

                    </button>

                    <div class="dropdown-divider"></div>

                    <button type="button" class="dropdown-item logout-item" (click)="logout()">

                        <span>⇥</span>
                        <span>Logout</span>

                    </button>

                </div>

                }

            </div>


        </header>

        <!-- PAGE CONTENT -->
        <main class="admin-content">
            <router-outlet></router-outlet>
        </main>

    </div>

</div>
