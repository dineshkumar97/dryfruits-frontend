<header class="header">

  <div class="container header-content">

    <!-- LOGO -->
    <a routerLink="/home" class="brand" (click)="closeMobileMenu()">
      <span class="brand-name">NutNest</span>
      <span class="brand-tagline">NATURE'S FINEST TREASURES</span>
    </a>

    <!-- MOBILE MENU BUTTON -->
    <button type="button" class="menu-toggle" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Toggle navigation menu">

      <span>{{ isMobileMenuOpen ? '✕' : '☰' }}</span>

    </button>

    <!-- NAVIGATION -->
    <nav class="navigation" [class.mobile-open]="isMobileMenuOpen">

      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMobileMenu()">Home</a>

      <a routerLink="/products" routerLinkActive="active" (click)="closeMobileMenu()">Products</a>
      @if (isLoggedIn()) {
        <a routerLink="/my-orders" routerLinkActive="active" (click)="closeMobileMenu()">My Orders</a>
        <a routerLink="/track-order" routerLinkActive="active" (click)="closeMobileMenu()">Track Order</a>
      }

      <a routerLink="/wishlist" routerLinkActive="active" class="wishlist-link" (click)="closeMobileMenu()">
        <span>♡</span> Wishlist
      </a>

      <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About Us</a>

      <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a>

    </nav>

    <!-- HEADER ACTIONS -->

    <!-- HEADER ACTIONS -->
    <div class="header-actions">

      <!-- LOGIN AND SIGNUP: NOT LOGGED IN -->
      @if (!isLoggedIn()) {

      <a routerLink="/login" class="login-btn">
        Login
      </a>

      <a routerLink="/signup" class="signup-btn">
        Sign Up
      </a>

      }

      <!-- CART: ALWAYS VISIBLE -->
      <a routerLink="/cart" class="cart-btn">
        <span>🛒</span>
        <span>Cart</span>
        <span class="cart-count">{{ cartService.cartCount() }}</span>
      </a>

      @if (isLoggedIn()) {
      <div class="customer-profile-wrapper" #customerProfile>

        <button type="button" class="customer-profile-btn" (click)="toggleProfileMenu()"
          [attr.aria-expanded]="isProfileMenuOpen" aria-label="Customer account menu">

          <span class="customer-avatar">{{ customerInitial() }}</span>
          <span class="profile-label">  {{ customerName() }}</span>

          <span class="profile-chevron" [class.open]="isProfileMenuOpen">
            ▾
          </span>

        </button>

        @if (isProfileMenuOpen) {

        <div class="customer-profile-dropdown">

          <div class="dropdown-heading">
            <strong>  {{ customerName() }}</strong>
            <span>Manage your NutNest account</span>
          </div>

          <button type="button" class="dropdown-item" (click)="openProfile()">
            <span>♙</span>
            <span>My Profile</span>
          </button>

          <button type="button" class="dropdown-item" (click)="openOrders()">
            <span>▤</span>
            <span>My Orders</span>
          </button>

          <div class="dropdown-divider"></div>

          <button type="button" class="dropdown-item logout-item" (click)="logout()">
            <span>⇥</span>
            <span>Logout</span>
          </button>

        </div>

        }

      </div>

      }

    </div>


  </div>

</header>
