<section class="product-details-page">

  <div class="container">

    <div class="breadcrumb">
      <a routerLink="/">Home</a>
      <span>/</span>
      <a routerLink="/products">Products</a>
      <span>/</span>
      <span>{{ product.name }}</span>
    </div>

    <div class="product-details">

      <div class="product-image">
        <img [src]="product.image" [alt]="product.name">
      </div>

      <div class="product-info">

        <span class="category">{{ product.category }}</span>

        <h1>{{ product.name }}</h1>

        <p class="description">
          {{ product.description }}
        </p>

        <div class="price">
          ₹{{ price }}
        </div>

        <div class="weight-section">
          <h3>Select Weight</h3>

          <div class="weight-options">
            @for (weight of weights; track weight) {
            <button type="button" [class.active]="selectedWeight === weight" (click)="selectedWeight = weight">
              {{ weight }}
            </button>
            }
          </div>
        </div>

        <div class="quantity-section">
          <h3>Quantity</h3>

          <div class="quantity-control">
            <button type="button" (click)="decreaseQuantity()">−</button>
            <span>{{ quantity }}</span>
            <button type="button" (click)="increaseQuantity()">+</button>
          </div>
        </div>

        <div class="total-price">
          Total: ₹{{ price * quantity }}
        </div>

        <button type="button" class="add-cart-btn" (click)="addToCart()">
          Add to Cart
        </button>

        <p class="delivery-note">
          Freshly packed with care by NutNest.
        </p>

      </div>

    </div>

  </div>

</section>
